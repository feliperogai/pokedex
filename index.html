<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Retro pixel-art Pokédex powered by PokéAPI.">
    <meta name="theme-color" content="#dc0a2d">
    <!-- Google Fonts: Press Start 2P (pixel) + VT323 (retro terminal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" href="./assets/images/icon.png">
    <title>Rogai - Pokédex</title>
</head>
<body>
    <!-- Header -->
    <header>
        <!-- Banner Image -->
        <img src="./assets/images/banner.png" alt="Pokémon" class="banner">
        <p class="subtitle">POKéDEX</p>
    </header>

    <!-- Stage: the Pokédex is scaled to always fit this area (no scroll) -->
    <main id="stage">
        <!-- Pokédex Container -->
        <div id="pokedex" class="tall">
            <!-- Left half: screen + controls -->
            <section class="panel left">
                <!-- Device lights -->
                <div id="lights">
                    <span class="big-light" id="status-light"></span>
                    <span class="small-light red"></span>
                    <span class="small-light yellow"></span>
                    <span class="small-light green"></span>
                    <span id="number">#001</span>
                </div>

                <!-- Screen frame -->
                <div id="screen-frame">
                    <!-- Top Section -->
                    <div id="top">
                        <!-- Top Bar with Search -->
                        <form id="search-form" autocomplete="off">
                            <span class="prompt">&gt;</span>
                            <input type="text" id="search" value="Bulbasaur" list="pokemon-list" aria-label="Search Pokémon by name or number" spellcheck="false" enterkeyhint="search">
                            <button type="submit" id="search-btn" aria-label="Search">GO</button>
                            <datalist id="pokemon-list"></datalist>
                        </form>
                        <!-- Pokémon Image Placeholder -->
                        <div id="poke-image-placeholder">
                            <img src="./assets/images/bulbasaur.png" id="pokemon-image" alt="Bulbasaur">
                            <div id="loading" hidden>LOADING<span class="dots">...</span></div>
                        </div>
                    </div>
                    <div id="speaker" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
                </div>

                <!-- Controls -->
                <div id="controls">
                    <div id="dpad">
                        <button type="button" id="prev" class="dpad-btn" aria-label="Previous Pokémon" title="Previous (&#8592;)">&#9664;</button>
                        <span class="dpad-center"></span>
                        <button type="button" id="next" class="dpad-btn" aria-label="Next Pokémon" title="Next (&#8594;)">&#9654;</button>
                    </div>
                    <div id="action-buttons">
                        <button type="button" id="cry" class="round-btn" aria-label="Play cry" title="Cry (C)">&#9835;</button>
                        <button type="button" id="random" class="round-btn" aria-label="Random Pokémon" title="Random (R)">?</button>
                        <button type="button" id="shiny" class="round-btn" aria-label="Toggle shiny sprite" aria-pressed="false" title="Shiny (S)">&#9733;</button>
                    </div>
                </div>
            </section>

            <!-- Hinge (only visible when the Pokédex is open side by side) -->
            <div class="hinge" aria-hidden="true"></div>

            <!-- Right half: data -->
            <section class="panel right">
                <!-- Data Section -->
                <div id="data">
                    <!-- Pokémon Name -->
                    <h2 id="pokemon-name">BULBASAUR</h2>
                    <p id="genus">Seed Pokémon</p>

                    <!-- Pokémon Types -->
                    <div id="types">
                        <span style="background-color: #74CB48;" class="type">Grass</span>
                        <span style="background-color: #A43E9E;" class="type">Poison</span>
                    </div>

                    <!-- Physical info -->
                    <div id="info">
                        <div><span class="label">HT</span> <span id="height">0.7 m</span></div>
                        <div><span class="label">WT</span> <span id="weight">6.9 kg</span></div>
                        <div><span class="label">AB</span> <span id="abilities">Overgrow</span></div>
                    </div>

                    <!-- Base Stats Title -->
                    <h4 id="base-stats">Base Stats <span id="total">318</span></h4>

                    <!-- Stats Section -->
                    <div id="stats">
                        <div class="stat-row">
                            <div class="stat-desc">HP</div>
                            <div class="stat-number">045</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 18%;"></div></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-desc">ATK</div>
                            <div class="stat-number">049</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 19%;"></div></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-desc">DEF</div>
                            <div class="stat-number">049</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 19%;"></div></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-desc">SATK</div>
                            <div class="stat-number">065</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 25%;"></div></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-desc">SDEF</div>
                            <div class="stat-number">065</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 25%;"></div></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-desc">SPD</div>
                            <div class="stat-number">045</div>
                            <div class="stat-bar"><div class="bar-outer"><div class="bar-inner" style="width: 18%;"></div></div></div>
                        </div>
                    </div>

                    <!-- Dialog box (messages / errors) -->
                    <div id="message" role="status" aria-live="polite">A strange seed was planted on its back at birth.</div>
                </div>
                <p class="hint">&#8592; &#8594; NAV &nbsp; R RANDOM &nbsp; S SHINY &nbsp; C CRY &nbsp; / SEARCH</p>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>© Felipe Rogai - 2024</p>
        <p class="press-start">PRESS START<span class="blink">_</span></p>
    </footer>

    <!-- JavaScript -->
    <script src="./assets/js/script.js"></script>
</body>
</html>
